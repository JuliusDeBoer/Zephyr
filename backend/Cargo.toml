[package]
name = "zephyr_backend"
version = "0.1.0"
edition = "2024"

[workspace]
members = [".", "migration"]

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
future-not-send = "allow"
unwrap_used = "warn"

[dependencies]
actix-web = "4.11.0"
argon2 = { version = "0.5.3", features = ["std"] }
base64 = "0.22.1"
chrono = "0.4.42"
dotenvy = "0.15.7"
env_logger = "0.11.8"
eyre = "0.6.12"
futures-util = "0.3.31"
hmac = "0.12.1"
hyper = { version = "1.7.0", features = [ "full" ] }
jwt = "0.16.0"
quick-xml = { version = "0.38.3", features = ["async-tokio"] }
rand = "0.9.2"
sea-orm = { version = "1.1.17", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "mock", "with-chrono", "with-uuid"] }
serde = { version = "1.0.223", features = ["derive"]}
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.17"
tokio = { version = "1.47.1", features = [ "full" ] }
uuid = { version = "1.18.1", features = [ "v4" ] }

[dev-dependencies]
pretty_assertions = "1.4.1"
